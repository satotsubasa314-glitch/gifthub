<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#B0503C">
<title>GiftHub｜贈る前に、相手の本音を。</title>
<style>
/* ==================================================================
   v0.7  ── アンケート n=29 の結果を反映した版
   ■ 変えたところ
     1. 入口を「気持ちを決める」から「候補を出す」へ
        （Q4で「何を伝えたいかが決まらない」は 0/28人だったため）
     2. ★新機能：中身を隠したまま ◯× で好みを聞く
        （自由記述の実践例。Q7で本音を言う人が 0/29人だったため）
     3. 答え合わせを「伝わった？」から「もう使った？」へ
        （評価ではなく事実。嘘をつく動機がない）
     4. かぶり防止（過去に贈ったものに印）
     5. ○年前の今日（写真を使わずに思い出を残す）
   ================================================================== */
:root{
  --bg:#FCFAF7; --surface:#fff; --ink:#241E1A; --ink2:#4A4138; --muted:#8A7E72;
  --accent:#B0503C; --accent2:#8E6B55; --soft:#F6EDE7; --ok:#3E6B52; --okbg:#E9F0EB;
  --no:#9B8E84; --line:#EDE5DC; --r:20px;
  --grad:linear-gradient(135deg,#B0503C 0%,#8E6B55 100%);
  --grad-soft:linear-gradient(135deg,#F7F1EB 0%,#F2EBE3 100%);
  --sh:0 1px 2px rgba(31,26,23,.04),0 12px 32px rgba(31,26,23,.055);
  --sh-lift:0 2px 6px rgba(31,26,23,.06),0 20px 48px rgba(176,80,60,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);line-height:1.72;font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;letter-spacing:.005em}
#app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);position:relative;overflow:hidden}
#app::before{content:"";position:absolute;top:-180px;right:-120px;width:340px;height:340px;
  border-radius:50%;background:var(--grad-soft);filter:blur(10px);opacity:.75;pointer-events:none}
.scr{flex:1;padding:26px 20px 112px;position:relative;z-index:1;
  animation:in .34s cubic-bezier(.16,.84,.26,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-size:24px;line-height:1.42;font-weight:800;letter-spacing:-.018em}
h2{font-size:17.5px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;line-height:1.72;margin-top:7px}
.jlab{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.08em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--sh)}
.card.hl{border-color:rgba(176,80,60,.35);box-shadow:var(--sh-lift)}
.card.ok{border-color:rgba(62,122,88,.3);background:#FBFEFC}

.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:17px;
  border:0;border-radius:16px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;
  font-family:inherit;cursor:pointer;letter-spacing:.01em;
  box-shadow:0 6px 18px rgba(176,80,60,.26);transition:transform .14s,box-shadow .2s,opacity .18s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.3;box-shadow:none;cursor:default}
.btn.g{background:transparent;color:var(--muted);font-weight:700;padding:13px;box-shadow:none}
.btn.s{background:var(--soft);color:var(--accent);box-shadow:none}
.btn.o{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}

input,textarea{width:100%;padding:15px 16px;font-size:16px;font-family:inherit;line-height:1.7;
  border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);resize:none;
  transition:border-color .16s}
input:focus,textarea:focus{outline:0;border-color:var(--accent)}
.fld{margin-bottom:14px}
.fld .jlab{display:block;margin-bottom:8px}

/* 循環図 */
.loop{display:grid;place-items:center;margin:6px auto 0}
.loop svg{display:block;overflow:visible}
.loop .trk{fill:none;stroke:var(--line);stroke-width:2}
.loop .arc{fill:none;stroke:#B0503C;stroke-width:3;stroke-linecap:round;
  stroke-dasharray:478;stroke-dashoffset:478;animation:dash 2.6s cubic-bezier(.3,.7,.3,1) .3s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.loop .nd{fill:#fff;stroke:var(--line);stroke-width:2.5}
.loop .nd.on{fill:#B0503C;stroke:#B0503C}
.loop .tx{font-size:11.5px;font-weight:800;fill:#8A7E72;font-family:-apple-system,"Hiragino Sans",sans-serif}
.loop .tx.on{fill:#B0503C}
.loop .ctr{font-size:10px;font-weight:800;fill:#8A7E72;letter-spacing:.12em}

/* ★好みを聞く（◯×カード） */
.pf{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);
  border-radius:16px;background:var(--surface);margin-bottom:10px;transition:.16s}
.pf .ic{width:50px;height:50px;flex:0 0 50px;border-radius:14px;background:var(--grad-soft);
  display:grid;place-items:center;font-size:24px}
.pf .m{flex:1;min-width:0}
.pf .nm{font-weight:700;font-size:14.5px;line-height:1.45}
.pf .pr{font-size:12.5px;color:var(--muted)}
.pf.yes{border-color:var(--ok);background:var(--okbg)}
.pf.no{opacity:.42}
.pf.may{border-color:var(--line);background:#FAF7F4}
.ox{display:flex;gap:7px;flex:0 0 auto}
.ox button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-size:17px;font-family:inherit;cursor:pointer;
  display:grid;place-items:center;transition:.14s;color:var(--muted);font-weight:800}
.ox button:active{transform:scale(.9)}
.ox button.on[data-v="y"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ox button.on[data-v="n"]{background:var(--no);border-color:var(--no);color:#fff}
.ox button.on[data-v="m"]{background:var(--ink);border-color:var(--ink);color:#fff}

.pick{display:flex;gap:12px;align-items:center;padding:16px;border:1.5px solid var(--line);
  border-radius:17px;background:var(--surface);cursor:pointer;margin-bottom:11px;
  box-shadow:var(--sh);transition:.15s}
.pick:active{transform:scale(.99)}
.pick .em{font-size:27px;width:46px;flex:0 0 46px;text-align:center}
.pick b{display:block;font-size:15.5px;font-weight:800}
.pick span{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-top:1px}
.pick.main{border-color:var(--accent);background:var(--soft)}

/* 好みの地図 */
.map{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.tag{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;
  background:var(--okbg);color:var(--ok)}
.tag.x{background:#F3EFEB;color:var(--no);text-decoration:line-through}

/* ○年前の今日 */
.ago{background:var(--grad-soft);border:1px solid rgba(176,80,60,.18);border-radius:var(--r);
  padding:17px;margin-top:16px}
.ago .y{font-size:11.5px;font-weight:800;color:var(--accent);letter-spacing:.08em}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.chip{padding:10px 15px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);
  font-size:14px;font-family:inherit;cursor:pointer;transition:.15s;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.item{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--line);
  border-radius:16px;background:var(--surface);cursor:pointer;margin-bottom:10px;transition:.15s}
.item.on{border-color:var(--accent);background:var(--soft);box-shadow:var(--sh-lift)}
.item.dup{opacity:.5}
.item .ic{width:50px;height:50px;flex:0 0 50px;border-radius:14px;background:var(--grad-soft);
  display:grid;place-items:center;font-size:24px}
.item .nm{font-weight:700;font-size:14.5px;line-height:1.5}
.item .pr{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;
  background:var(--okbg);color:var(--ok);margin-left:6px}
.badge.w{background:#FCF1E6;color:#9A6A2E}

.av{width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:15.5px}
.row .nt{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.vd{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px}
.vd.u{background:var(--okbg);color:var(--ok)}
.vd.s{background:var(--soft);color:var(--accent)}
.vd.y{background:#F3EFEB;color:var(--muted)}
.vbtn{width:100%;padding:16px;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);
  font-family:inherit;font-size:15.5px;font-weight:800;text-align:left;cursor:pointer;margin-bottom:9px;
  transition:.15s;color:var(--ink)}
.vbtn.on{border-color:var(--accent);background:var(--soft);box-shadow:var(--sh-lift)}
.vbtn small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}

.hero{background:var(--grad);border-radius:26px;padding:30px 22px;color:#fff;text-align:center;
  box-shadow:0 18px 44px rgba(176,80,60,.3);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 10%,rgba(255,255,255,.22),transparent 60%)}
.hero>*{position:relative}
.hero .big{font-size:60px;line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.quote{background:rgba(255,255,255,.2);border-radius:16px;padding:15px;margin-top:18px;
  font-size:14.5px;line-height:1.8;text-align:left}
.seal{border:1.5px dashed rgba(255,255,255,.55);border-radius:16px;padding:20px;margin-top:18px;
  cursor:pointer;font-size:13.5px;font-weight:800;background:rgba(255,255,255,.1)}

.steps{display:flex;gap:5px;margin-bottom:20px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.3s}
.steps i.on{background:var(--accent)}
.bar2{display:flex;gap:4px;align-items:center;margin-bottom:16px;font-size:11px;color:var(--muted);font-weight:700}
.bar2 b{color:var(--accent)}

.note{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;
  color:var(--muted);font-size:13.5px}
.bar{position:sticky;bottom:0;display:flex;gap:5px;padding:7px 9px;font-size:10.5px;z-index:5;
  background:rgba(255,252,249,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar button{flex:1;padding:7px 2px;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;font-size:10px;font-family:inherit;color:var(--muted);cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar .t{display:grid;place-items:center;padding:0 6px;color:var(--muted);font-weight:800}
.stack{display:flex;flex-direction:column;gap:12px}
.m12{margin-top:12px}.m16{margin-top:16px}.m24{margin-top:24px}
.url{font-size:11.5px;word-break:break-all;background:#F9F4EF;border-radius:12px;padding:12px;
  color:var(--muted);line-height:1.6}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 8px;text-align:center}
.sum b{display:block;font-size:24px;font-weight:800;line-height:1.2}
.sum span{font-size:10.5px;color:var(--muted);font-weight:700}
.prog{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--grad);transition:width .3s}

/* 線画アイコン（絵文字のかわり） */
.ic-s{display:inline-block;vertical-align:-.18em;flex:0 0 auto}
.item .ic,.pf .ic{color:var(--accent);background:#F7F2EC;border:1px solid var(--line)}
.pc .im{color:var(--accent)}
.tl2{color:var(--ink)}
.tl2 .ic-s{color:var(--accent);margin-bottom:2px}
.chip .ic-s{color:inherit;margin-right:3px}
.chip.on .ic-s{color:#fff}
.dw .mi .e{color:var(--accent);display:grid;place-items:center}
.hd .rt{color:var(--ink);display:grid;place-items:center}
.tc .ic{line-height:0}
.st .ck .ic-s{color:#fff}
.vd .ic-s{margin-right:2px}
/* 商品タイルを写真なしでも成立させる */
.pc .im{background:linear-gradient(160deg,#F8F3EC 0%,#F1E9DF 100%)}
.item .ic{border-radius:12px}
</style>
</head>
<body><div id="app"></div>
<script>
/* ==================================================================
   GiftHub（仮） v1.2
   ■ v1.2 で変えたこと
     1. 絵文字をやめ、線画アイコン（SVG）に統一
        → 絵文字は端末ごとに見た目が変わり、作り込みが浅く見えるため
     2. カテゴリ・シーン・贈る相手を、大和様の実際のサイトに合わせた
        （PRESENTERS ROOM https://presentersroom.jp/ の構造）
     3. 価格は税込表示（大和様のサイトに合わせる）
   ================================================================== */
const CFG = { name:"GiftHub", ver:"1.2", key:"gifthub_v12" };

/* ===== 線画アイコン ==================================================
   絵文字を使わず、同じ太さ・同じ角丸の線で統一します。
   色は currentColor を継承するので、置いた場所の色になじみます。
   =================================================================== */
const IC = {
  gift:    'M3 9h18v3H3zM4 12h16v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM12 9v12M12 9c-2 0-4-1-4-3s2-2 4 3zM12 9c2 0 4-1 4-3s-2-2-4 3z',
  sweets:  'M5 20h14M6 20v-5a6 6 0 0 1 12 0v5M12 9V5M10 5h4',
  gourmet: 'M6 3v8a2 2 0 0 0 4 0V3M8 11v10M18 3c-1.5 2-2 4-2 6v3h3M17 12v9',
  drink:   'M6 4h10l-1 14a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zM16 7h2a2 2 0 0 1 0 5h-2',
  home:    'M4 11 12 4l8 7M6 10v10h12V10M10 20v-6h4v6',
  towel:   'M5 4h14v16H5zM9 4v16M5 8h14M5 12h14M5 16h14',
  beauty:  'M9 3h6v4H9zM8 7h8l1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM10 12h4',
  flower:  'M12 13v8M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 7V3M12 13 8 9M12 13l4-4M12 13l-4 4M12 13l4 4',
  exp:     'M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1 0 4H5a2 2 0 0 1 0-4 2 2 0 0 0 0-4zM14 6v12',
  baby:    'M12 3a5 5 0 0 1 5 5v2a5 5 0 0 1-10 0V8a5 5 0 0 1 5-5zM9 9h.01M15 9h.01M9 13c1.5 1.5 4.5 1.5 6 0M5 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2',
  goods:   'M6 7h12l1 13H5zM9 7V5a3 3 0 0 1 6 0v2',
  catalog: 'M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h8M8 11h8M8 15h5',
  /* シーン */
  cake:    'M4 20h16M5 20v-6h14v6M7 14v-3M12 14v-3M17 14v-3M7 11V9M12 11V8M17 11V9',
  ring:    'M12 21a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM9 9 7 4h10l-2 5M10 4l2 3 2-3',
  bag:     'M5 8h14l1 12H4zM9 8V6a3 3 0 0 1 6 0v2M9 12h6',
  heal:    'M12 4v8M8 8h8M4 14h16v6H4z',
  season:  'M12 2v20M2 12h20M5 5l14 14M19 5 5 19',
  /* 機能 */
  chat:    'M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z',
  target:  'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',
  note:    'M6 3h9l4 4v14H6zM15 3v4h4M9 12h6M9 16h4',
  user:    'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1',
  cog:     'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.4 3H9.6l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4.8l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6c.07-.33.1-.66.1-1z',
  search:  'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',
  bell:    'M18 16V11a6 6 0 1 0-12 0v5l-2 3h16zM10 22h4',
  check:   'M4 12.5 9.5 18 20 6',
  ok:      'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8 12l3 3 5-6',
  ng:      'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9 9l6 6M15 9l-6 6',
  mid:     'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8 12h8',
  arrow:   'M5 12h14M13 6l6 6-6 6',
  back:    'M19 12H5M11 18l-6-6 6-6',
  mail:    'M3 6h18v12H3zM3 7l9 6 9-6',
  box:     'M3 8 12 3l9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v10',
  clock:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  truck:   'M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  phone:   'M7 3h10a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM10 18h4',
  card:    'M3 6h18v12H3zM3 10h18M6 15h4',
  plan:    'M7 3v3M17 3v3M4 8h16M4 6h16v15H4zM8 12h3M8 16h7',
  spark:   'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z'
};
function icon(k, size, sw){
  const d = IC[k] || IC.gift;
  return `<svg class="ic-s" viewBox="0 0 24 24" width="${size||22}" height="${size||22}"
    fill="none" stroke="currentColor" stroke-width="${sw||1.6}"
    stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
}

/* ===== 気持ち（絵文字をやめ、線画に） =============================== */
const EMOTIONS = [
  { id:"thanks", ic:"flower", label:"ありがとう", honest:false, t:"いつもありがとう。" },
  { id:"cheer",  ic:"spark",  label:"がんばれ",   honest:false, t:"応援してる。無理しすぎないでね。" },
  { id:"care",   ic:"heal",   label:"おつかれ",   honest:false, t:"最近大変そうだから、ちゃんと休んでね。" },
  { id:"congra", ic:"cake",   label:"おめでとう", honest:false, t:"おめでとう。自分のことみたいにうれしい。" },
  { id:"miss",   ic:"mail",   label:"会いたい",   honest:false, t:"ふと思い出した。元気にしてる？" },
  { id:"sorry",  ic:"chat",   label:"ごめんね",   honest:false, t:"ちゃんと謝りたかった。ごめんね。" },
  { id:"duty",   ic:"catalog",label:"正直、義理", honest:true,  t:"かたくならずに受け取ってもらえたら、うれしい。" },
  { id:"self",   ic:"user",   label:"自分のため", honest:true,  t:"どうしても渡したくなった。" },

function pack(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,""); }

function prefsOf(fid){
  const map = {};
  S.asks.filter(a => a.toId === fid && a.answers).forEach(a => {
    Object.keys(a.answers).forEach(k => { map[k] = a.answers[k]; });
  });
  return map;
}
function alreadySent(fid, gid){ return S.gifts.some(g => g.toId === fid && g.gift.id === gid); }
function suggest(fid, n, budget){
  const p = prefsOf(fid);
  let pool = GIFTS.filter(g => p[g.id] !== "n");
  if(budget) pool = pool.filter(g => g.price >= budget[0] && g.price <= budget[1]);
  if(!pool.length) pool = GIFTS.slice();
  return pool.map(g => ({ g, s:(p[g.id]==="y"?3:p[g.id]==="m"?1:2) - (alreadySent(fid,g.id)?2:0) }))
             .sort((a,b)=>b.s-a.s).slice(0, n||3).map(x=>x.g);
}

function talkAnswer(q){
  const t = String(q||"");
  let best = null, bs = 0;
  KB.forEach(e => {
    const s = e.k.reduce((n,w) => n + (t.indexOf(w) >= 0 ? w.length : 0), 0);
    if(s > bs){ bs = s; best = e; }
  });
  if(best) return best;
  /* 商品名で聞かれたとき */
  const g = GIFTS.find(x => t.indexOf(x.name.slice(0,4)) >= 0 || t.indexOf(x.cat) >= 0);
  if(g) return { a:`<b>${g.name}</b>（${yen(g.price)}／${g.cat}）\n\nこのアプリでは、相手が ◯ をつけた場合にだけ前に出します。\n\n<b>いちばん確実なのは、本人に ◯× で聞くことです。</b>`, act:"ask" };
  return { a:"うまく聞き取れませんでした。\n\nこんなふうに聞いてもらえると答えやすいです。\n\n<b>・相手がキャンプ好きなんだけど何も知らない</b>\n<b>・友人へのギフトの予算は？</b>\n<b>・目上の人に贈るときの注意は？</b>\n<b>・かぶらないようにしたい</b>", act:null };
}

const DT = id => DTYPES[id] || DTYPES.jitsu;

/* 判定（上から順に見て、最初に当てはまったタイプ） */
function diagType(s){
  const g = k => s[k] || 0;
  if(g("word") <= -2)                     return "shizuka";
  if(g("word") >= 2 && g("use") <= 0)     return "kotoba";
  if(g("honest") >= 2)                    return "sunao";
  if(g("price") <= -2 && g("keep") < 0)   return "kiduka";
  if(g("exp") >= 2)                       return "taiken";
  if(g("self") >= 2)                      return "kodawari";
  if(g("novel") >= 2)                     return "tansaku";
  if(g("alc") >= 2 || (g("keep") <= -2 && g("sweet") <= -2)) return "nomi";
  if(g("keep") <= -1)                     return "kie";
  if(g("use") >= 2)                       return "jitsu";
  if(g("novel") <= -2)                    return "teiban";
  return "toki";
}

/* 商品のおすすめ度 */
function diagScore(diag, g){
  if(!diag) return 0;
  const t = DT(diag.type), sc = diag.sc || {};
  let s = 0;
  if((t.likeId||[]).indexOf(g.cat) >= 0) s += 3;
  if((t.avoidId||[]).indexOf(g.cat) >= 0) s -= 4;
  if((sc.sweet||0) < 0 && g.cat === "sweets") s -= 3;
  if((sc.arom||0)  < 0 && g.cat === "beauty") s -= 3;
  if((sc.alc||0)   < 0 && g.cat === "drink")  s -= 1;
  if((sc.alc||0)   > 0 && g.cat === "drink")  s += 2;
  if((sc.price||0) < 0 && g.price >= 3000) s -= 3;
  if((sc.price||0) > 0 && g.price >= 3000) s += 1;
  if((sc.exp||0)   > 0 && g.cat === "exp") s += 2;
  if((sc.self||0)  > 0 && g.cat === "catalog") s += 3;
  if((sc.keep||0)  < 0 && (g.cat === "sweets" || g.cat === "gourmet")) s += 1;
  return s;
}

/* 4本の軸を棒で見せる */
function diagBars(sc){
  const ax = [
    ["消えもの","残るもの","keep"],
    ["おまかせ","自分で選ぶ","self"],
    ["気分","実用","use"],
    ["モノ","体験","exp"]
  ];
  return `<div class="bars">${ax.map(a=>{
    const v = Math.max(-3, Math.min(3, sc[a[2]] || 0));
    const pct = ((v + 3) / 6) * 100;
    return `<div class="bar4"><span class="l">${a[0]}</span>
      <span class="t"><i style="left:calc(${pct}% - 6px)"></i></span>
      <span class="r">${a[1]}</span></div>`;
  }).join("")}</div>`;
}

function upcomingBirthdays(){
  if(S.ntBd === false) return [];
  const now = new Date();
  return S.friends.filter(f => f.bd).map(f => {
    const [m, d] = f.bd.split("-").map(Number);
    let t = new Date(now.getFullYear(), m-1, d);
    if(t < new Date(now.getFullYear(), now.getMonth(), now.getDate())) t = new Date(now.getFullYear()+1, m-1, d);
    const days = Math.round((t - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    return { f, days, md:f.bd };
  }).filter(x => x.days <= 14).sort((a,b) => a.days - b.days);
}

/* ==================================================================
   候補の出し方を上書き（診断結果を反映する版）
   ①相手の診断結果 ②◯×の答え ③かぶり の3つで並べ替えます
   ================================================================== */
suggest = function(fid, n, budget){
  const f  = friend(fid);
  const pr = prefsOf(fid);
  const dg = f.diag ? { type:f.diag, sc:(f.diagSc || {}) } : null;
  let pool = GIFTS.filter(g => pr[g.id] !== "n");
  if(budget) pool = pool.filter(g => g.price >= budget[0] && g.price <= budget[1]);
  if(!pool.length) pool = GIFTS.slice();
  const scored = pool.map(g => {
    let s = 0;
    if(pr[g.id] === "y") s += 6;
    else if(pr[g.id] === "m") s += 1;
    s += diagScore(dg, g);
    if(alreadySent(fid, g.id)) s -= 5;
    return { g, s };
  }).sort((a,b) => b.s - a.s);
  const seed = (S.draft && S.draft.seed) ? S.draft.seed : 0;
  const top  = scored.slice(0, Math.max(9, (n||3) * 3));
  const off  = (seed * (n||3)) % Math.max(1, top.length);
  return top.slice(off).concat(top.slice(0, off)).slice(0, n || 3).map(x => x.g);
};

draw = function(){
  document.getElementById("app").innerHTML = (V[cur] ? V[cur]() : V.home()) + bar() + drawer();

    el.addEventListener("click", (ev) => { ev.stopPropagation(); act(el.dataset); }));

};

/* ===== 操作 ========================================================= */
function act(d){
  const D = S.draft;
  switch(d.a){
    case "login": {
      const n=(document.getElementById("nm").value||"").trim();
      if(!n){ alert("名前を入れてください"); return; }
      S=seed(n); S.showDiag=true; save(); go("diag"); break;    /* ★本物の認証はこの行を差しかえ／登録後すぐ診断へ */
    }
    case "demo":   S=seed("つばさ"); save(); go("home"); break;
    case "logout": S.menu=false; S.session.in=false; save(); go("login"); break;
    case "home":   S.draft=null; S.planId=null; save(); go("home"); break;
    case "note":   S.menu=false; save(); go("note"); break;
    case "jump":   go(d.v); break;
    case "wipe":   S.menu=false; if(confirm("保存したデータを消して最初からにしますか？")) wipe(); else draw(); break;


    /* ===== メニュー・画面移動 ===== */
    case "menu":      S.menu = true;  save(); draw(); break;
    case "closemenu": S.menu = false; save(); draw(); break;
    case "go-friends": S.menu=false; S.draft=null; save(); go("friends"); break;
    case "go-shop":    S.menu=false; S.shopGift=null; save(); go("shop"); break;
    case "settings":   S.menu=false; save(); go("settings"); break;

    /* ===== ショップ ===== */
    case "shopbud": S.shopBud = Number(d.v); S.menu=false; save(); go("shop"); break;
    case "shopcat": S.shopCat = d.v || null;  S.menu=false; save(); go("shop"); break;
    case "gdetail": S.shopGift = d.id; save(); go("gdetail"); break;
    case "giveThis": S.giveGift = S.shopGift; save(); go("friends"); break;

    /* ===== 設定 ===== */
    case "tgDiag": S.showDiag   = (S.showDiag===false);   save(); go("settings"); break;
    case "tgRec":  S.showRec    = (S.showRec===false);    save(); go("settings"); break;
    case "tgBd":   S.ntBd       = (S.ntBd===false);       save(); go("settings"); break;
    case "tgRe":   S.ntRe       = (S.ntRe===false);       save(); go("settings"); break;
    case "tgAgo":  S.ntAgo      = (S.ntAgo===false);      save(); go("settings"); break;
    case "tgHon":  S.showHonest = (S.showHonest===false); save(); go("settings"); break;
    case "savecfg": {
      const n = (document.getElementById("snm")||{}).value || "";
      const b = (document.getElementById("sbd")||{}).value || "";
      const f = (document.getElementById("sft")||{}).value || "";
      if(n.trim()) S.user.name = n.trim();
      S.myBd = b.trim(); S.myNote = f.trim();
      save(); alert("保存しました"); go("home"); break;
    }

    /* ===== ギフト診断 ===== */
    case "diag": S.menu=false; S.dhist=[]; S.dq = 0; S.dsc = { keep:0, self:0, use:0, novel:0, exp:0, sweet:0, arom:0, alc:0, price:0, honest:0, word:0, back:0 };
                 S.diagTmp = null; save(); go("diag"); break;
    case "dq": {
      /* d.v は "keep+2" のような形。キー＋符号＋強さ */
      const m = String(d.v).match(/^([a-z]+)([+-])(\d)$/);
      if(m){
        const key = m[1], sign = (m[2] === "+" ? 1 : -1), mag = Number(m[3]);
        S.dsc = S.dsc || {};
        S.dsc[key] = (S.dsc[key] || 0) + sign * mag;
      }
      S.dhist = (S.dhist || []).concat([d.v]);
      S.dq = (S.dq || 0) + 1;
      if(S.dq >= DQ.length){ S.diagTmp = { type: diagType(S.dsc), sc: S.dsc, at: today() }; }
      save(); go("diag"); break;
    }
    case "dback": {
      if((S.dq||0) <= 0) break;
      const last = (S.dhist||[]).pop();
      if(last){
        const m = String(last).match(/^([a-z]+)([+-])(\d)$/);
        if(m){ S.dsc[m[1]] -= (m[2]==="+"?1:-1) * Number(m[3]); }
      }
      S.dq--; S.diagTmp = null; save(); go("diag"); break;
    }
    case "dsave": {
      S.diag = S.diagTmp || S.diag;
      /* 自分の診断は、見本の友だちにも入れておく（デモで効果が見えるように） */
      if(S.friends[0] && !S.friends[0].diag) S.friends[0].diag = "kotoba";
      if(S.friends[1] && !S.friends[1].diag){ S.friends[1].diag = "taiken"; }
      if(S.friends[2] && !S.friends[2].diag){ S.friends[2].diag = "kiduka"; }
      save(); go("home"); break;
    }
    case "dagain": S.dq = 0; S.dsc = { keep:0, self:0, use:0, novel:0, exp:0, sweet:0, arom:0, alc:0, price:0, honest:0, word:0, back:0 };
                   S.dhist = []; S.diagTmp = null; save(); go("diag"); break;
    case "mycard": S.diagTmp = S.diag; save(); go("diagres"); break;

    /* ===== ギフト計画 ===== */
    case "newplan": S.pgoal = null; save(); go("newplan"); break;
    case "pg": S.pgoal = d.v; save(); go("newplan"); break;
    case "mkplan": {
      const due = (document.getElementById("pdue")||{}).value || "";
      const id = "p"+Date.now();
      S.plans = S.plans || [];
      S.plans.unshift({ id, toId:D.toId, goal:S.pgoal, due, steps:makeSteps(), done:false, at:today() });
      S.planId = id; S.pgoal = null; save(); go("plan"); break;
    }
    case "plan": {
      const p = (S.plans||[]).find(x => x.id === d.id); if(!p) break;
      S.planId = p.id;
      S.draft = { toId:p.toId, askItems:[], giftId:null, emotion:null, message:"",
                  ho:false, budget:0, wrapId:null, card:true, payId:"card" };
      save(); go("plan"); break;
    }
    case "ps": {
      const p = (S.plans||[]).find(x => x.id === S.planId); if(!p) break;
      p.steps[Number(d.v)].ok = !p.steps[Number(d.v)].ok;
      p.done = p.steps.every(s => s.ok);
      save(); go("plan"); break;
    }
    case "delplan": {
      if(!confirm("この計画をやめますか？")) break;
      S.plans = (S.plans||[]).filter(x => x.id !== S.planId);
      S.planId = null; save(); go("home"); break;
    }

    /* ===== 相手を選ぶ ===== */
    case "pick": {
      S.menu = false;
      S.draft = { toId:d.id, askItems:[], giftId:S.giveGift||null, emotion:null, message:"",
                  ho:false, budget:0, wrapId:null, card:true, payId:"card" };
      if(S.giveGift){ S.giveGift = null; save(); go("word"); }
      else { save(); go("pick"); }
      break;
    }
    case "backPick": go("pick"); break;

    /* 好みを聞く */
    case "toAsk": go("ask"); break;
    case "selA": {
      const a = D.askItems || [];
      D.askItems = a.includes(d.id) ? a.filter(x=>x!==d.id) : a.concat([d.id]);
      save(); go("ask"); break;
    }
    case "mkAsk": {
      const id = "a"+Date.now();
      S.asks.unshift({ id, toId:D.toId, createdAt:today(), items:D.askItems.slice(), answers:null, done:false, seen:false });
      D.askId = id; save(); go("asklink"); break;
    }
    case "pa": { S.pans = S.pans || {}; S.pans[d.id] = d.v; save(); go("pans"); break; }
    case "psend": {
      const t = S.asks.find(x => x.id === (S.pbox && S.pbox.id)) || S.asks.find(x => !x.done);
      if(t){ t.answers = Object.assign({}, S.pans); t.done = true; t.seen = false; }
      S.pans = null; save(); go("psent"); break;
    }
    case "ans": {
      const a = S.asks.find(x=>x.id===d.id); if(!a) break;
      a.seen = true;
      S.draft = { toId:a.toId, askId:a.id, askItems:[], giftId:null, emotion:null, message:"",
                  ho:false, budget:0, wrapId:null, card:true, payId:"card" };
      save(); go("ansview"); break;
    }
    case "gpick": D.giftId = d.id; save(); go("word"); break;

    /* AI */
    case "talk": S.menu=false; save(); go("talk"); break;
    case "tq":   talkSend(d.v); break;
    case "tsend": {
      const el = document.getElementById("tq");
      const q = (el && el.value || "").trim();
      if(!q) return;
      talkSend(q); break;
    }
    case "tclear": S.talk = []; save(); go("talk"); break;
    case "fromTalkAsk": {
      if(S.draft && S.draft.toId) go("ask");
      else { alert("まず、だれに贈るかを選んでください。"); go("home"); }
      break;
    }
    case "fromTalkDiag": go("diag"); break;

    /* ① 選ぶ */
    case "toItems": go("items"); break;
    case "bud":  D.budget = Number(d.v); D.giftId = null; save(); go("items"); break;
    case "gi":   D.giftId = d.id; save(); go("items"); break;
    case "reroll": D.seed = (D.seed||0) + 1; D.giftId = null; save(); go("items"); break;

    /* ② ひと言 */
    case "toWord": go("word"); break;
    case "fold": D.ho = !D.ho; save(); go("word"); break;
    case "em": {
      const el = document.getElementById("msg");
      if(el && D.emotion) D.message = el.value;
      D.emotion = d.id; D.message = compose(D);
      save(); go("word"); break;
    }

    /* ③ ラッピング */
    case "toWrap": {
      const el = document.getElementById("msg");
      if(el) D.message = el.value;
      if(!D.wrapId) D.wrapId = "w1";
      save(); go("wrap"); break;
    }
    case "wr": D.wrapId = d.id; save(); go("wrap"); break;
    case "cardck": { const c = document.getElementById("card"); D.card = c ? c.checked : !D.card; save(); break; }

    /* ④ 支払い */
    case "toPay": { const c = document.getElementById("card"); if(c) D.card = c.checked; save(); go("pay"); break; }
    case "py": D.payId = d.id; save(); go("pay"); break;

    /* ⑤ 注文確定 */
    case "order": {
      const g = GI(D.giftId), w = WR(D.wrapId), p = PY(D.payId||"card");
      const total = g.price + w.price + (p.fee||0);
      const id = "g"+Date.now();
      S.gifts.unshift({
        id, no:orderNo(), toId:D.toId, sentAt:today(),
        intent:{ emotion:D.emotion }, message:D.message,
        gift:{ id:g.id, icon:g.icon, name:g.name, price:g.price },
        wrap:{ id:w.id, name:w.name, price:w.price },
        card:!!D.card, pay:p.id, total, receive:null, reply:null
      });
      /* 計画があれば「注文する」に自動でチェック */
      const pl = (S.plans||[]).find(x => x.toId === D.toId && !x.done);
      if(pl){ pl.steps[4].ok = true; pl.done = pl.steps.every(s=>s.ok); }
      D.orderId = id; save(); go("ordered"); break;
    }

    case "copy":
      navigator.clipboard.writeText(d.v)
        .then(()=>alert("リンクをコピーしました。LINEなどで送ってください。"))
        .catch(()=>alert("コピーできませんでした。画面のリンクを選んでコピーしてください。"));
      break;
    case "openr": location.href = d.v; break;

    /* 受け取る側 */
    case "open": S.opened = true; save(); go("recv"); break;
    case "rm":   S.rpick = d.id; save(); go("recv"); break;
    case "rs":   S.rslot = d.v;  save(); go("recv"); break;
    case "rconf": {
      const a = document.getElementById("addr");
      if(S.rpick === "deli" && (!a || !a.value.trim())){ alert("お届け先を入力してください"); return; }
      S.rmethod = S.rpick;
      const t = S.gifts.find(x => !x.receive);
      if(t){ t.receive = { method:S.rpick, slot:S.rslot || "指定なし", at:today() }; }
      save(); go("recv"); break;
    }
    case "rv":   S.rv = d.v; save(); go("recv"); break;
    case "reply": {
      const cm = (document.getElementById("cm")||{}).value || "";
      const t = S.gifts.find(x => !x.reply);
      if(t){ t.reply = { used:S.rv, comment:cm, at:today() }; }
      S.rv=null; S.opened=false; S.rmethod=null; S.rpick=null; S.rslot=null;
      save(); go("sent"); break;
    }
  }
}

function talkSend(q){
  S.talk = S.talk || [];
  S.talk.push({ r:"me", t:q });
  const r = talkAnswer(q);
  S.talk.push({ r:"ai", t:r.a, act:r.act });
  save(); go("talk");
  setTimeout(()=>window.scrollTo(0, document.body.scrollHeight), 60);
}

function compose(d){
  const e = EM(d.emotion), g = GI(d.giftId);
  let tail = g ? "\n" + g.name + "、よかったら使ってね。" : "";
  if(g && g.keep && g.keep <= 5) tail = "\n" + g.name + "です。日持ちが短いので、早めに食べてね。";
  return e.t + tail;
}

/* ===== 起動 ========================================================= */
(function boot(){
  const q = new URLSearchParams(location.search);
  const r = q.get("r"), p = q.get("p"), dd = q.get("d");
  if(r){ const o = unpack(r); if(o){ S.inbox=o; S.opened=false; S.rmethod=null; cur="recv"; draw(); return; } }
  if(p){ const o = unpack(p); if(o){ S.pbox=o; S.pans=S.pans||{}; cur="pans"; draw(); return; } }
  if(dd){ const o = unpack(dd); if(o){ S.dbox=o; cur="dview"; draw(); return; } }
  cur = S.session.in ? "home" : "login";
  draw();
})();
</script>
